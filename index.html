<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoidStream — Ad-Free Twitch</title>
  <meta name="description" content="100% client-side, ad-free Twitch live stream player." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: #2a2a35;
      --accent: #9147ff;
      --accent2: #772ce8;
      --text: #efeff1;
      --muted: #8b8b9e;
      --chat-w: 340px;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ── Navbar ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* ── Channel bar ── */
    .channel-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex: 1;
      max-width: 480px;
    }

    .channel-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .channel-bar input:focus {
      border-color: var(--accent);
    }

    .channel-bar input::placeholder {
      color: var(--muted);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* ── Status bar ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      font-size: 13px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 36px;
      color: var(--muted);
    }

    #status-bar.ok {
      color: #4ade80;
    }

    #status-bar.err {
      color: #f87171;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eb0400;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
      display: none;
    }

    #status-bar.ok .live-dot {
      display: block;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(235, 4, 0, .6);
      }

      50% {
        opacity: .7;
        box-shadow: 0 0 0 5px rgba(235, 4, 0, 0);
      }
    }

    /* ── Layout ── */
    #app {
      display: flex;
      height: calc(100vh - 56px - 36px);
      overflow: hidden;
    }

    /* ── Player ── */
    #player-wrap {
      flex: 1;
      min-width: 0;
      background: #000;
      position: relative;
    }

    /* Twitch embed iframe fills the player area completely */
    #twitch-embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* ── Chat ── */
    #chat-wrap {
      width: var(--chat-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      background: var(--surface2);
    }

    .chat-header span {
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
    }

    #chat-iframe {
      flex: 1;
      border: none;
      background: var(--surface);
      width: 100%;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
        height: auto;
        overflow: auto;
      }

      #player-wrap {
        height: 56vw;
        min-height: 200px;
      }

      #chat-wrap {
        width: 100%;
        height: 400px;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .channel-bar {
        max-width: 100%;
      }

      header {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 16px;
        gap: 10px;
      }

      #status-bar {
        padding: 8px 16px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 1rem;
      }

      .badge {
        display: none;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <!-- ════════ HEADER ════════ -->
  <header>
    <div class="logo">VoidStream</div>
    <div class="badge">Ad-Free</div>
    <div class="channel-bar">
      <input id="channel-input" type="text" placeholder="Channel name…" autocomplete="off" spellcheck="false" />
      <button class="btn" id="load-btn">▶ Load</button>
    </div>
  </header>

  <!-- ════════ STATUS BAR ════════ -->
  <div id="status-bar">
    <div class="live-dot"></div>
    <span id="status-text">Enter a channel name and press Load.</span>
  </div>

  <!-- ════════ MAIN ════════ -->
  <div id="app">

    <!-- Twitch embed player -->
    <div id="player-wrap">
      <!--
      player.twitch.tv embed:
      - Zero CORS issues (Twitch serves its own player)
      - Low Latency mode enabled natively
      - Ad-blocking works via TTV LOL PRO / Purple Adblock extensions
        (they intercept network requests inside this iframe too)
      - "parent" is dynamically set to the page's hostname
    -->
      <iframe id="twitch-embed" allowfullscreen allow="autoplay; fullscreen" title="Twitch Stream"></iframe>
    </div>

    <!-- ChatIS chat -->
    <div id="chat-wrap">
      <div class="chat-header">
        💬 Live Chat <span>via ChatIS</span>
      </div>
      <iframe id="chat-iframe" title="Live Chat" allowfullscreen></iframe>
    </div>

  </div>

  <!-- ════════ JS ════════ -->
  <script>
    'use strict';

    /* ─────────────────────────────────────────────────────────
       CONFIG
       Change DEFAULT_CHANNEL to whatever you want to auto-load.
     ────────────────────────────────────────────────────────── */
    const DEFAULT_CHANNEL = 'shroud';

    /* ─────────────────────────────────────────────────────────
       HOW THE PLAYER WORKS
       ─────────────────────────────────────────────────────────
       We use the official Twitch Embed Player iframe
       (player.twitch.tv). This completely bypasses CORS — there
       are no cross-origin XHR requests at all. The browser just
       loads an iframe from Twitch's own domain.
    
       For ad-blocking: install TTV LOL PRO or Purple Adblock.
       These extensions intercept requests *inside* the iframe
       and strip ads at the token level — they work here exactly
       as they do on the main Twitch site.
    
       The "parent" query param is Twitch's domain allowlist.
       We set it dynamically to the page's own hostname.
       • GitHub Pages  → justakrem.github.io  (set automatically)
       • Local file    → we use "localhost" (Twitch allows this)
     ────────────────────────────────────────────────────────── */

    /* Determine parent domain for Twitch embed allowlist */
    const PARENT = window.location.hostname || 'localhost';

    /* Build Twitch embed URL */
    const twitchEmbedURL = (ch) => {
      const params = new URLSearchParams({
        channel: ch,
        parent: PARENT,
        autoplay: 'true',
        muted: 'true',
        // Low Latency mode — Twitch enables it per-channel
        // Nothing to set here; Twitch respects channel's LL setting
      });
      return `https://player.twitch.tv/?${params}`;
    };

    /* Build ChatIS v2 URL */
    const chatisURL = (ch) =>
      `https://chatis.is2511.com/v2/?channel=${ch}&size=1&font=11&shadow=1`;

    /* ── DOM refs ── */
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const twitchEmbed = document.getElementById('twitch-embed');
    const chatIframe = document.getElementById('chat-iframe');
    const channelInput = document.getElementById('channel-input');
    const loadBtn = document.getElementById('load-btn');

    /* ── UI helpers ── */
    function setStatus(msg, cls = '') {
      statusText.textContent = msg;
      statusBar.className = cls;
    }

    /* ── Load a channel ── */
    function loadChannel(ch) {
      ch = ch.trim().toLowerCase();
      if (!ch) {
        setStatus('⚠️ Please enter a channel name.', 'err');
        return;
      }

      channelInput.value = ch;
      setStatus(`🔄 Loading ${ch}…`);

      /* Set both iframes */
      twitchEmbed.src = twitchEmbedURL(ch);
      chatIframe.src = chatisURL(ch);

      /*
       * The Twitch embed fires no reliable JS events cross-origin,
       * so we optimistically mark as "playing" after a short delay.
       * The user will see a "channel offline" message inside the
       * embed itself if the channel is not live.
       */
      setTimeout(() => {
        setStatus(`✅ Playing ${ch} (install TTV LOL PRO for ad-free)`, 'ok');
      }, 3500);
    }

    /* ── Events ── */
    loadBtn.addEventListener('click', () => loadChannel(channelInput.value));
    channelInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadChannel(channelInput.value);
    });

    /* ── Auto-load on open ── */
    window.addEventListener('DOMContentLoaded', () => {
      channelInput.value = DEFAULT_CHANNEL;
      loadChannel(DEFAULT_CHANNEL);
    });
  </script>
</body>

</html>
